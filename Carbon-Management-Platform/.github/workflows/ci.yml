name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/carbon_management
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci_only_secret_with_more_than_32_characters_123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
